<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX MEMORY PRO</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #fff; padding: 20px; margin: 0; }
        .btn { padding: 15px 30px; font-size: 18px; margin: 10px; border-radius: 8px; border: none; cursor: pointer; background: #00e676; color: black; font-weight: bold; width: 80%; max-width: 300px; }
        #game { display: none; }
    </style>
</head>
<body>
    <h1>INDEX MEMORY PRO</h1>
    <div id="lobby">
        <button class="btn" id="loginBtn">Quick Match</button>
        <p id="status">Tap above to start matching!</p>
    </div>
    <div id="game">
        <h2>Room: <span id="roomId"></span></h2>
        <h3>Score: <span id="score">0 - 0</span></h3>
        <button class="btn" id="scoreBtn">Tap to Score!</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Replace with your actual web app config from Firebase Console
        const firebaseConfig = { apiKey: "API_KEY", databaseURL: "DATABASE_URL", projectId: "PROJECT_ID" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let user, currentRoomRef, currentRoomId;

        document.getElementById('loginBtn').onclick = async () => {
            document.getElementById('status').innerText = "Matching...";
            const cred = await signInAnonymously(auth);
            user = cred.user;
            findMatch();
        };

        function findMatch() {
            onValue(ref(db, 'rooms'), (snap) => {
                const rooms = snap.val();
                let joined = false;
                if (rooms) {
                    for (let id in rooms) {
                        if (!rooms[id].player2 && rooms[id].player1 !== user.uid) {
                            joinRoom(id);
                            joined = true;
                            break;
                        }
                    }
                }
                if (!joined) createRoom();
            }, { onlyOnce: true });
        }

        function createRoom() {
            currentRoomRef = push(ref(db, 'rooms'));
            currentRoomId = currentRoomRef.key;
            set(currentRoomRef, { player1: user.uid, score1: 0, player2: null, score2: 0 });
            listenToRoom();
        }

        function joinRoom(id) {
            currentRoomId = id;
            currentRoomRef = ref(db, `rooms/${id}`);
            set(ref(db, `rooms/${id}/player2`), user.uid);
            listenToRoom();
        }

        function listenToRoom() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('roomId').innerText = currentRoomId;

            onValue(currentRoomRef, (snap) => {
                const r = snap.val();
                if (!r) return;
                const isP1 = r.player1 === user.uid;
                document.getElementById('score').innerText = isP1 ? `${r.score1} - ${r.score2}` : `${r.score2} - ${r.score1}`;
            });
        }

        document.getElementById('scoreBtn').onclick = () => {
            onValue(currentRoomRef, (snap) => {
                const r = snap.val();
                const isP1 = r.player1 === user.uid;
                set(ref(db, `rooms/${currentRoomId}/${isP1 ? 'score1' : 'score2'}`), (isP1 ? r.score1 : r.score2) + 1);
            }, { onlyOnce: true });
        };
    </script>
</body>
</html>
