<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index Memory Pro - 3D Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0d1f;
      --bg-purple: #1a1138;
      --cyan-glow: #38e8ff;
      --purple-glow: #9b5cff;
      --glass-bg: rgba(25, 28, 56, 0.55);
      --glass-border: rgba(114, 210, 255, 0.35);
      --text-main: #ffffff;
      --text-muted: #b8c4e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #23184b 0%, #10132b 55%, #080a17 100%);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Animated Constellation & Particle Canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating Decorative 3D Cards in Background */
    .floating-deco {
      position: fixed;
      width: 64px;
      height: 86px;
      border-radius: 12px;
      background: rgba(30, 35, 75, 0.45);
      border: 1.5px solid rgba(130, 190, 255, 0.4);
      box-shadow: 0 0 20px rgba(100, 150, 255, 0.25), inset 0 0 12px rgba(160, 110, 255, 0.2);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      z-index: 1;
      pointer-events: none;
      animation: floatCard 6s ease-in-out infinite;
    }

    .deco-1 { top: 32%; left: 6%; transform: rotate(-18deg); animation-delay: 0s; }
    .deco-2 { top: 24%; right: 6%; transform: rotate(15deg); animation-delay: 1.5s; }
    .deco-3 { bottom: 26%; left: 5%; transform: rotate(-14deg); animation-delay: 3s; }
    .deco-4 { top: 52%; right: 5%; transform: rotate(18deg); animation-delay: 2s; }
    .deco-5 { bottom: 16%; right: 7%; transform: rotate(-12deg); animation-delay: 4s; }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
      50% { transform: translateY(-14px) rotate(calc(var(--rot, 0deg) + 4deg)); }
    }

    .app-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Section */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .brain-3d {
      font-size: 64px;
      filter: drop-shadow(0 0 18px rgba(255, 115, 179, 0.65)) drop-shadow(0 0 30px rgba(56, 232, 255, 0.5));
      animation: pulseBrain 3.5s ease-in-out infinite;
      position: relative;
    }

    @keyframes pulseBrain {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.06) translateY(-4px); }
    }

    .brand-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 2.35rem;
      line-height: 0.95;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #9ef8ff 0%, #3dc8ff 50%, #a56eff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(61, 200, 255, 0.35));
    }

    .tagline {
      font-size: 0.85rem;
      letter-spacing: 1.4px;
      color: #d6e4ff;
      text-transform: uppercase;
      margin-bottom: 22px;
      text-align: center;
